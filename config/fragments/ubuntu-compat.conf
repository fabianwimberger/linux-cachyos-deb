# Ubuntu userspace requirements. Applied after cachy.conf, so it wins.

## ---- AppArmor ------------------------------------------------------------
# CachyOS ships CONFIG_LSM without apparmor. On Ubuntu that leaves snapd, lxd
# and /etc/apparmor.d profiles unconfined without logging an error.
-e SECURITY_APPARMOR
-e SECURITY_APPARMOR_HASH
-e SECURITY_APPARMOR_HASH_DEFAULT
-e AUDIT
--set-str LSM "landlock,lockdown,yama,integrity,apparmor,bpf"
-e DEFAULT_SECURITY_APPARMOR

## ---- module signing ------------------------------------------------------
# Ubuntu's config references debian/canonical-certs.pem, absent outside their
# source package; certs/ fails to build with it set.
--set-str SYSTEM_TRUSTED_KEYS ""
--set-str SYSTEM_REVOCATION_KEYS ""
# Sign in-tree modules with a key the build generates and throws away, as both
# Ubuntu and CachyOS do. Without it every in-tree module load sets the E taint
# bit. Out-of-tree modules stay unsigned, so a machine with DKMS modules is
# still tainted — the same as on Ubuntu's own kernel.
-e MODULE_SIG_ALL
-e MODULE_SIG_KEY_TYPE_ECDSA
-d MODULE_SIG_KEY_TYPE_RSA
# Not forced: an unsigned DKMS module has to stay loadable.
-d MODULE_SIG_FORCE
# Kept enabled so tools/sign-mok.sh can sign modules without a rebuild.
-e MODULE_SIG
-e MODULE_COMPRESS
-e MODULE_COMPRESS_ZSTD
# Ubuntu compresses modules in its own packaging; bindeb-pkg only does it with
# MODULE_COMPRESS_ALL. Without this the install is ~670 MB instead of ~350 MB.
-e MODULE_COMPRESS_ALL

## ---- BTF -----------------------------------------------------------------
# Required by bpftrace and BPF CO-RE consumers; Ubuntu generic provides it.
-e DEBUG_INFO_BTF
-e DEBUG_INFO_BTF_MODULES
-e IKCONFIG
-e IKCONFIG_PROC

## ---- Rust ----------------------------------------------------------------
# Ubuntu 26.04 generic sets CONFIG_RUST=y; it does not use LTO. Here it is not
# selectable at all — init/Kconfig has
#   depends on !DEBUG_INFO_BTF || (PAHOLE_HAS_LANG_EXCLUDE && !LTO)
# and this config enables both ThinLTO and BTF. Set explicitly so the reason is
# recorded rather than looking like an oversight. Toolchain is not the blocker
# (rustc 1.93 vs 1.85 required, bindgen 0.72 vs 0.71).
-d RUST

## ---- initramfs / boot ----------------------------------------------------
# initramfs-tools with MODULES=most.
-e BLK_DEV_INITRD
-e RD_ZSTD
-e RD_LZ4
-e RD_GZIP
-e OVERLAY_FS
-e CGROUPS
-e MEMCG
-e CGROUP_BPF
-e BPF_SYSCALL
-e BPF_JIT
-e USER_NS
-e SECCOMP
-e SECCOMP_FILTER
# Root on LVM or LUKS.
-e BLK_DEV_DM
-e DM_CRYPT
-e MD

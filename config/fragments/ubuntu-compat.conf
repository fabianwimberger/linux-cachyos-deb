# Ubuntu userspace requirements. Applied after cachy.conf, so it wins.

## ---- AppArmor ------------------------------------------------------------
# CachyOS's CONFIG_LSM has no apparmor, which on Ubuntu silently leaves snapd,
# lxd and /etc/apparmor.d unconfined. Put it back.
-e SECURITY_APPARMOR
-e SECURITY_APPARMOR_HASH
-e SECURITY_APPARMOR_HASH_DEFAULT
-e AUDIT
--set-str LSM "landlock,lockdown,yama,integrity,apparmor,bpf"
-e DEFAULT_SECURITY_APPARMOR

## ---- module signing ------------------------------------------------------
# Ubuntu's config points at debian/canonical-certs.pem, absent outside their
# source package; certs/ fails to build with it set.
--set-str SYSTEM_TRUSTED_KEYS ""
--set-str SYSTEM_REVOCATION_KEYS ""
# Sign in-tree modules with a throwaway key the build generates, like Ubuntu
# and CachyOS: otherwise every in-tree module sets the E taint bit. Out-of-tree
# DKMS modules stay unsigned (not forced), so a machine with them is tainted
# exactly as on Ubuntu's own kernel.
-e MODULE_SIG_ALL
-e MODULE_SIG_KEY_TYPE_ECDSA
-d MODULE_SIG_KEY_TYPE_RSA
-d MODULE_SIG_FORCE
-e MODULE_SIG
-e MODULE_COMPRESS
-e MODULE_COMPRESS_ZSTD
# bindeb-pkg only compresses modules with MODULE_COMPRESS_ALL; without it the
# install is ~670 MB instead of ~350 MB.
-e MODULE_COMPRESS_ALL

## ---- BTF -----------------------------------------------------------------
# Required by bpftrace and BPF CO-RE consumers; Ubuntu generic provides it.
-e DEBUG_INFO_BTF
-e DEBUG_INFO_BTF_MODULES
-e IKCONFIG
-e IKCONFIG_PROC

## ---- Rust ----------------------------------------------------------------
# Ubuntu sets CONFIG_RUST=y (no LTO). Here it is unselectable: init/Kconfig
# depends on !DEBUG_INFO_BTF || (PAHOLE_HAS_LANG_EXCLUDE && !LTO), and this
# config enables both ThinLTO and BTF. Explicit so it is not an oversight.
-d RUST

## ---- initramfs / boot ----------------------------------------------------
# initramfs-tools with MODULES=most.
-e BLK_DEV_INITRD
-e RD_ZSTD
-e RD_LZ4
-e RD_GZIP
-e OVERLAY_FS
-e CGROUPS
-e MEMCG
-e CGROUP_BPF
-e BPF_SYSCALL
-e BPF_JIT
-e USER_NS
-e SECCOMP
-e SECCOMP_FILTER
# Root on LVM or LUKS.
-e BLK_DEV_DM
-e DM_CRYPT
-e MD
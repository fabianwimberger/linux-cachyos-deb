# CachyOS default profile as config deltas.
#
# Sources: the PKGBUILD's scripts/config calls for the default options, and
# choices in their shipped `config` that Ubuntu's config turns off (last
# section). Not taken from upstream: driver *_DEBUG symbols, LOADPIN_ENFORCE,
# module-load loosening, distro-policy hostname/loglevel values, and a few
# options upstream defaults off (_per_gov, _tcp_bbr3, _use_kcfi).
#
# Format: `scripts/config` arguments, one directive per line.

## ---- CachyOS base --------------------------------------------------------
# Scheduler stays EEVDF (the tarball has no SCHED_BORE; BORE needs a patch).
-e CACHY
-e SCHED_CLASS_EXT

## ---- codegen -------------------------------------------------------------
-e LTO_CLANG_THIN
# AutoFDO. CachyOS ships their default kernel profiled (PKGBUILD _autofdo=no
# is a local build). With no profile passed in, clang just adjusts debug info;
# a stage-2 build passes CLANG_AUTOFDO_PROFILE for the real optimisation.
-e AUTOFDO_CLANG
-d LTO_NONE
-d CC_OPTIMIZE_FOR_PERFORMANCE
-e CC_OPTIMIZE_FOR_PERFORMANCE_O3

## ---- latency profile -----------------------------------------------------
-d HZ_300
-e HZ_1000
--set-val HZ 1000
-d HZ_PERIODIC
-d NO_HZ_IDLE
-d CONTEXT_TRACKING_FORCE
-e NO_HZ_FULL_NODEF
-e NO_HZ_FULL
-e NO_HZ
-e NO_HZ_COMMON
-e CONTEXT_TRACKING
# Ubuntu generic ships PREEMPT_LAZY.
-e PREEMPT
-d PREEMPT_LAZY
-d PREEMPT_VOLUNTARY
-d PREEMPT_NONE

## ---- memory --------------------------------------------------------------
-e TRANSPARENT_HUGEPAGE
-e TRANSPARENT_HUGEPAGE_ALWAYS
-d TRANSPARENT_HUGEPAGE_MADVISE
# DAMON reclaim and LRU-sort, active only after being enabled at runtime.
-e DAMON
-e DAMON_VADDR
-e DAMON_PADDR
-e DAMON_SYSFS
-e DAMON_RECLAIM
-e DAMON_LRU_SORT
# Ubuntu defaults to lzo; CONFIG_CACHY sets swappiness to 100.
--set-str ZSWAP_COMPRESSOR_DEFAULT "zstd"
-e ZSWAP_COMPRESSOR_DEFAULT_ZSTD
-d ZSWAP_COMPRESSOR_DEFAULT_LZO

## ---- RCU -----------------------------------------------------------------
-e RCU_EXPERT
-e RCU_BOOST
--set-val RCU_BOOST_DELAY 500
--set-val RCU_FANOUT 64
--set-val RCU_FANOUT_LEAF 16
-d RCU_EXP_KTHREAD

## ---- desktop -------------------------------------------------------------
# Wine/Proton sync primitives.
-m NTSYNC
# BBR available but not default, matching upstream (_tcp_bbr3=no).
-m TCP_CONG_BBR
-m TCP_CONG_BBR3
-e NET_SCH_FQ

## ---- upstream config, not PKGBUILD ---------------------------------------
# Choices in CachyOS's shipped config that Ubuntu's config turns off.

# zswap active at boot, using the zstd default set above.
-e ZSWAP_DEFAULT_ON
# zram defaults to zstd, with recompression to a second algorithm available.
-e ZRAM_DEF_COMP_ZSTD
-d ZRAM_DEF_COMP_LZORLE
--set-str ZRAM_DEF_COMP "zstd"
-e ZRAM_MULTI_COMP
# Keep the huge zero folio allocated rather than freeing and refaulting it.
-e PERSISTENT_HUGE_ZERO_FOLIO
# THP for shmem and tmpfs where madvised (Ubuntu defaults both to never).
-e TRANSPARENT_HUGEPAGE_SHMEM_HUGE_ADVISE
-d TRANSPARENT_HUGEPAGE_SHMEM_HUGE_NEVER
-e TRANSPARENT_HUGEPAGE_TMPFS_HUGE_ADVISE
-d TRANSPARENT_HUGEPAGE_TMPFS_HUGE_NEVER
# Steal-time accounting, like IRQ_TIME_ACCOUNTING below.
-e PARAVIRT_TIME_ACCOUNTING
# Task can ask for a slice extension to finish a critical section.
-e RSEQ_SLICE_EXTENSION
# ORC unwinder (Ubuntu uses frame pointers, which cost a register per fn).
-e UNWINDER_ORC
-d UNWINDER_FRAME_POINTER
-d FRAME_POINTER
# Charge interrupt time to the interrupted task, so the scheduler sees it.
-e IRQ_TIME_ACCOUNTING
# Indirect branch tracking, Tiger Lake and newer.
-e X86_KERNEL_IBT
# Gather Data Sampling mitigation.
-e MITIGATION_GDS
# Posted MSIs, which coalesce interrupt delivery under load.
-e X86_POSTED_MSI
# TPM 2.0 transport encryption.
-e TCG_TPM2_HMAC
# fq_codel as the default qdisc instead of pfifo_fast. Built in, because the
# default qdisc cannot be a module.
-e NET_SCH_FQ_CODEL
-e NET_SCH_DEFAULT
-e DEFAULT_FQ_CODEL
--set-str DEFAULT_NET_SCH "fq_codel"
# binder, for Waydroid. Ubuntu ships these as modules, which 7.2 rejects
# because the symbols became bool.
-e ANDROID_BINDER_IPC
-e ANDROID_BINDERFS
--set-str ANDROID_BINDER_DEVICES "binder,hwbinder,vndbinder"
# io.latency for cgroup v2.
-e BLK_CGROUP_IOLATENCY
# On-demand cachefiles, used by erofs over fscache.
-e CACHEFILES_ONDEMAND
# Skip the network stack when the NFS server is on the same host.
-e NFS_LOCALIO
-e LDISC_AUTOLOAD
-e FAT_DEFAULT_UTF8
# DAMON's stat collection stays off until asked for, as upstream ships it.
-d DAMON_STAT_ENABLED_DEFAULT
# Ubuntu turns on the per-cpu stall cputime report; upstream does not.
-d RCU_CPU_STALL_CPUTIME
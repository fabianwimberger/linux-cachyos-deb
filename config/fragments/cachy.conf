# CachyOS default profile as config deltas.
#
# Two sources, both from linux-cachyos at the matching tag:
#   - the PKGBUILD's scripts/config calls for the default options
#     (_cachy_config=yes, _cpusched=cachyos, _cc_harder=yes, _HZ_ticks=1000,
#     _tickrate=full, _preempt=full, _hugepage=always, _use_llvm_lto=thin)
#   - choices in their shipped `config` that Ubuntu's config turns off, in the
#     last section below
#
# Not taken from upstream, with reasons, so a re-audit does not have to
# re-derive them:
#   - the ~200 driver and subsystem *_DEBUG / *_DEBUGFS symbols Arch enables
#   - SECURITY_LOADPIN_ENFORCE: pins module loading to the root block device,
#     which no DKMS module and no initramfs-tools rebuild survives
#   - MODULE_FORCE_LOAD, MODULE_ALLOW_MISSING_NAMESPACE_IMPORTS: loosen module
#     loading for no gain here
#   - DEFAULT_HOSTNAME, SECURITY_TOMOYO_* paths, CONSOLE_LOGLEVEL_*,
#     ARCH_MMAP_RND_BITS, LOG_BUF_SHIFT: distro policy, Ubuntu's values kept
#   - USE_X86_SEG_SUPPORT: not selectable, the dependency is unmet with clang
#   - _per_gov, _tcp_bbr3, _use_kcfi: upstream defaults them off, so neither
#     the performance governor nor BBR-as-default apply. AUTOFDO_CLANG is a
#     different case: the PKGBUILD defaults it off but CachyOS turns it on for
#     the kernel they ship, so this is a real gap, not a match
#
# Format: `scripts/config` arguments, one directive per line.

## ---- CachyOS base --------------------------------------------------------
# Scheduler stays EEVDF: the tarball has no SCHED_BORE symbol. BORE requires
# kernel-patches/7.2/sched/0001-bore-cachy.patch.
-e CACHY
-e SCHED_CLASS_EXT

## ---- codegen -------------------------------------------------------------
-e LTO_CLANG_THIN
# AutoFDO. CachyOS ships their default kernel profiled; the PKGBUILD's
# _autofdo=no only describes a local build. With no profile passed in, clang
# only adjusts debug information and runtime performance is unchanged, which is
# also the state needed to collect a profile from this kernel. Stage 2 passes
# CLANG_AUTOFDO_PROFILE and gets the optimisation.
-e AUTOFDO_CLANG
-d LTO_NONE
-d CC_OPTIMIZE_FOR_PERFORMANCE
-e CC_OPTIMIZE_FOR_PERFORMANCE_O3

## ---- latency profile -----------------------------------------------------
-d HZ_300
-e HZ_1000
--set-val HZ 1000
-d HZ_PERIODIC
-d NO_HZ_IDLE
-d CONTEXT_TRACKING_FORCE
-e NO_HZ_FULL_NODEF
-e NO_HZ_FULL
-e NO_HZ
-e NO_HZ_COMMON
-e CONTEXT_TRACKING
# Ubuntu generic ships PREEMPT_LAZY.
-e PREEMPT
-d PREEMPT_LAZY
-d PREEMPT_VOLUNTARY
-d PREEMPT_NONE

## ---- memory --------------------------------------------------------------
-e TRANSPARENT_HUGEPAGE
-e TRANSPARENT_HUGEPAGE_ALWAYS
-d TRANSPARENT_HUGEPAGE_MADVISE
# DAMON reclaim and LRU-sort, as linux-cachyos ships them. Both stay inactive
# until enabled at runtime.
-e DAMON
-e DAMON_VADDR
-e DAMON_PADDR
-e DAMON_SYSFS
-e DAMON_RECLAIM
-e DAMON_LRU_SORT
# Ubuntu defaults to lzo; CONFIG_CACHY sets swappiness to 100.
--set-str ZSWAP_COMPRESSOR_DEFAULT "zstd"
-e ZSWAP_COMPRESSOR_DEFAULT_ZSTD
-d ZSWAP_COMPRESSOR_DEFAULT_LZO

## ---- RCU -----------------------------------------------------------------
# RCU_EXPERT exposes the knobs below.
-e RCU_EXPERT
-e RCU_BOOST
--set-val RCU_BOOST_DELAY 500
--set-val RCU_FANOUT 64
--set-val RCU_FANOUT_LEAF 16
-d RCU_EXP_KTHREAD

## ---- desktop -------------------------------------------------------------
# Wine/Proton sync primitives.
-m NTSYNC
# BBR available but not default, matching upstream CachyOS (_tcp_bbr3=no).
-m TCP_CONG_BBR
-m TCP_CONG_BBR3
-e NET_SCH_FQ

## ---- upstream config, not PKGBUILD ---------------------------------------
# Choices in CachyOS's shipped config that Ubuntu's config turns off.

# zswap active at boot, using the zstd default set above.
-e ZSWAP_DEFAULT_ON
# zram defaults to zstd, with recompression to a second algorithm available.
-e ZRAM_DEF_COMP_ZSTD
-d ZRAM_DEF_COMP_LZORLE
--set-str ZRAM_DEF_COMP "zstd"
-e ZRAM_MULTI_COMP
# Keep the huge zero folio allocated rather than freeing and refaulting it.
-e PERSISTENT_HUGE_ZERO_FOLIO
# THP for shmem and tmpfs where madvised. Ubuntu defaults both to never.
-e TRANSPARENT_HUGEPAGE_SHMEM_HUGE_ADVISE
-d TRANSPARENT_HUGEPAGE_SHMEM_HUGE_NEVER
-e TRANSPARENT_HUGEPAGE_TMPFS_HUGE_ADVISE
-d TRANSPARENT_HUGEPAGE_TMPFS_HUGE_NEVER
# Steal time accounting, for the same reason as IRQ_TIME_ACCOUNTING below.
-e PARAVIRT_TIME_ACCOUNTING
# Lets a task ask for a slice extension to finish a critical section.
-e RSEQ_SLICE_EXTENSION
# ORC unwinder. Ubuntu builds with frame pointers instead, which costs a
# register and a prologue in every function.
-e UNWINDER_ORC
-d UNWINDER_FRAME_POINTER
-d FRAME_POINTER
# Charge interrupt time to the interrupted task, so the scheduler sees it.
-e IRQ_TIME_ACCOUNTING
# Indirect branch tracking, Tiger Lake and newer.
-e X86_KERNEL_IBT
# Gather Data Sampling mitigation.
-e MITIGATION_GDS
# Posted MSIs, which coalesce interrupt delivery under load.
-e X86_POSTED_MSI
# TPM 2.0 transport encryption.
-e TCG_TPM2_HMAC
# fq_codel as the default qdisc instead of pfifo_fast. Built in, because the
# default qdisc cannot be a module.
-e NET_SCH_FQ_CODEL
-e NET_SCH_DEFAULT
-e DEFAULT_FQ_CODEL
--set-str DEFAULT_NET_SCH "fq_codel"
# binder, for Waydroid. Ubuntu ships these as modules, which 7.2 rejects
# because the symbols became bool.
-e ANDROID_BINDER_IPC
-e ANDROID_BINDERFS
--set-str ANDROID_BINDER_DEVICES "binder,hwbinder,vndbinder"
# io.latency for cgroup v2.
-e BLK_CGROUP_IOLATENCY
# On-demand cachefiles, used by erofs over fscache.
-e CACHEFILES_ONDEMAND
# Skip the network stack when the NFS server is on the same host.
-e NFS_LOCALIO
-e LDISC_AUTOLOAD
-e FAT_DEFAULT_UTF8
# DAMON's stat collection stays off until asked for, as upstream ships it.
-d DAMON_STAT_ENABLED_DEFAULT
# Ubuntu turns on the per-cpu stall cputime report; upstream does not.
-d RCU_CPU_STALL_CPUTIME

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  kernel:
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        flavor: [x64v4, x64v3, znver4]

    steps:
      - uses: actions/checkout@v7

      - name: free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android \
                      /usr/share/dotnet /usr/local/.ghcup /opt/ghc \
                      /usr/local/share/powershell /usr/share/swift
          sudo docker image prune -af
          df -h /

      - run: make image
      - run: make preflight
      - run: make fetch

      - name: fetch autofdo profile
        env:
          PROFILE_DEPLOY_KEY: ${{ secrets.AUTOFDO_DEPLOY_KEY }}
        run: |
          if [ -z "$PROFILE_DEPLOY_KEY" ]; then
            echo 'no AUTOFDO_DEPLOY_KEY secret — building without a profile'
            exit 0
          fi
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "$PROFILE_DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          GIT_SSH_COMMAND='ssh -i ~/.ssh/id_deploy' \
            git clone --depth 1 git@github.com:fabianwimberger/linux-cachyos-deb-profiles.git /tmp/profiles
          mkdir -p profiles
          cp /tmp/profiles/vmlinux.afdo profiles/

      - run: make config FLAVOR=${{ matrix.flavor }}
      - run: make build FLAVOR=${{ matrix.flavor }}
      - run: make package FLAVOR=${{ matrix.flavor }}

      - uses: actions/upload-artifact@v7
        with:
          name: debs-${{ matrix.flavor }}
          path: out/${{ matrix.flavor }}/*.deb
          retention-days: 1

  publish:
    needs: kernel
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: debs-*
          path: artifacts

      - name: lay packages out as make expects
        run: |
          for dir in artifacts/debs-*; do
            flavor=${dir##*debs-}
            mkdir -p "out/$flavor"
            mv "$dir"/*.deb "out/$flavor/"
          done
          ls -lhR out

      - run: make image
      - run: make repo

      - name: sign the repository
        env:
          SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY" | gpg --batch --import
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          export REPO_SIGN_KEY="$fpr"
          make sign
          test -f repo/InRelease

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            repo/*
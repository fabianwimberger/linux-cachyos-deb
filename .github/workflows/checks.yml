name: checks

on:
  push:
    branches: [main, develop]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main, develop]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: |
          curl -sSL "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz" | tar -xJf -
          sudo cp shellcheck-v0.11.0/shellcheck /usr/local/bin/
          shellcheck -S warning -s bash scripts/*.sh

  config:
    runs-on: ubuntu-26.04
    # Source fetch + per-flavor config generation only, no compile. The real
    # build runs on release tags (release.yml).
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - run: make image
      - run: make fetch

      - name: verify config for every flavor
        run: |
          . ./kernel.env
          for f in $FLAVORS; do
            make config FLAVOR="$f"
          done

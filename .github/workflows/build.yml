name: build

on:
  push:
    branches: [main, develop]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main, develop]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    runs-on: ubuntu-26.04
    # One flavor per job: a ThinLTO kernel on a 4-vCPU runner needs most of the
    # 6 hour job limit on its own.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        flavor: [x64v4, x64v3]

    steps:
      - uses: actions/checkout@v4

      - name: free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android \
                      /usr/share/dotnet /usr/local/.ghcup /opt/ghc \
                      /usr/local/share/powershell /usr/share/swift
          sudo docker image prune -af
          df -h /

      - run: make image
      - run: make preflight
      - run: make fetch
      - run: make config FLAVOR=${{ matrix.flavor }}
      - run: make build FLAVOR=${{ matrix.flavor }}
      - run: make package FLAVOR=${{ matrix.flavor }}

      - name: report sizes
        run: |
          ls -lh out/${{ matrix.flavor }}
          df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.flavor }}
          path: out/${{ matrix.flavor }}/*.deb
          retention-days: 7

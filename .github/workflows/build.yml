name: build

on:
  push:
    branches: [main, develop]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main, develop]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    runs-on: ubuntu-26.04
    # One flavor per job: a ThinLTO kernel on a 4-vCPU runner needs most of the
    # 6 hour job limit on its own.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        flavor: [x64v4, x64v3, znver4]

    steps:
      - uses: actions/checkout@v4

      - name: free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android \
                      /usr/share/dotnet /usr/local/.ghcup /opt/ghc \
                      /usr/local/share/powershell /usr/share/swift
          sudo docker image prune -af
          df -h /

      - run: make image
      - run: make preflight
      - run: make fetch
      - name: fetch autofdo profile
        env:
          PROFILE_DEPLOY_KEY: ${{ secrets.AUTOFDO_DEPLOY_KEY }}
        run: |
          if [ -z "$PROFILE_DEPLOY_KEY" ]; then
            echo 'no AUTOFDO_DEPLOY_KEY secret — building without a profile'
            exit 0
          fi
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "$PROFILE_DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          GIT_SSH_COMMAND='ssh -i ~/.ssh/id_deploy' \
            git clone --depth 1 git@github.com:fabianwimberger/linux-cachyos-deb-profiles.git /tmp/profiles
          mkdir -p profiles
          cp /tmp/profiles/vmlinux.afdo profiles/

      - run: make build FLAVOR=${{ matrix.flavor }}
      - run: make package FLAVOR=${{ matrix.flavor }}

      - name: report sizes
        run: |
          ls -lh out/${{ matrix.flavor }}
          df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.flavor }}
          path: out/${{ matrix.flavor }}/*.deb
          retention-days: 7
